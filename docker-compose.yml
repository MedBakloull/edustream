name: edustream

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edustream-backend
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-mysuperdupercoopersecret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/courses"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edustream-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8080
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-mysuperdupercoopersecret}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: edustream-network
